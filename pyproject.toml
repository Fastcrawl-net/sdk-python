[project]
name = "fastcrawl"
version = "0.1.2"
description = "Fastcrawl — web scraping & crawling API for AI agents. Clean LLM-ready markdown from any URL over REST and MCP."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastcrawl"]
