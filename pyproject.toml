[project]
name = "fastcrawl"
version = "0.1.3"
description = "Fastcrawl — web scraping & crawling API for AI agents. Clean LLM-ready markdown from any URL over REST and MCP."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]

# PyPI showed home_page=None / project_urls=None for this package while
# fastcrawl-cli declared all three, so the more-installed SDK carried no link
# back to the product on a page that is itself an authority signal.
[project.urls]
Homepage = "https://fastcrawl.net"
Documentation = "https://fastcrawl.net/docs"
Repository = "https://github.com/Fastcrawl-net/sdk-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastcrawl"]
